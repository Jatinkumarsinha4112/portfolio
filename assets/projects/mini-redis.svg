<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 800 560" role="img" aria-labelledby="title desc">
<title id="title">Mini Redis in Java</title>
<desc id="desc">A RESP2 client sends commands to a Java TCP server that stores keys, snapshots data, and replicates writes.</desc>
<defs>
  <linearGradient id="bg" x2="1" y2="1"><stop stop-color="#17232d"/><stop offset="1" stop-color="#19162b"/></linearGradient>
  <linearGradient id="glow" x2="1"><stop stop-color="#69e6d9"/><stop offset="1" stop-color="#b78cff"/></linearGradient>
  <filter id="shadow" x="-.2" y="-.2" width="1.4" height="1.5"><feDropShadow dx="0" dy="15" stdDeviation="14" flood-color="#06080c" flood-opacity=".42"/></filter>
</defs>
<rect width="800" height="560" rx="28" fill="url(#bg)"/>
<g opacity=".16" stroke="#91a2bb" stroke-width="1"><path d="M0 70h800M0 140h800M0 210h800M0 280h800M0 350h800M0 420h800M0 490h800"/><path d="M80 0v560M160 0v560M240 0v560M320 0v560M400 0v560M480 0v560M560 0v560M640 0v560M720 0v560"/></g>
<text x="58" y="65" fill="#8fe9df" font-family="monospace" font-size="15" letter-spacing="3">JAVA · TCP · RESP2</text>
<text x="58" y="108" fill="#f3f4fa" font-family="Arial,sans-serif" font-size="30" font-weight="700">Mini Redis</text>
<g filter="url(#shadow)">
 <rect x="55" y="172" width="210" height="274" rx="20" fill="#101720" stroke="#596676"/>
 <text x="80" y="210" fill="#a8b5c5" font-family="monospace" font-size="13">CLIENT</text>
 <rect x="78" y="232" width="164" height="58" rx="11" fill="#1b2832"/>
 <text x="96" y="267" fill="#6fe4d8" font-family="monospace" font-size="17">SET name Jatin</text>
 <rect x="78" y="308" width="164" height="58" rx="11" fill="#1b2832"/>
 <text x="96" y="343" fill="#c5a4ff" font-family="monospace" font-size="17">RPUSH list item</text>
 <text x="80" y="408" fill="#8591a0" font-family="monospace" font-size="12">RESP2 COMMANDS</text>
 <rect x="317" y="154" width="256" height="308" rx="24" fill="#18232e" stroke="url(#glow)" stroke-width="2"/>
 <text x="350" y="195" fill="#9aaabb" font-family="monospace" font-size="13">JAVA TCP SERVER</text>
 <rect x="350" y="220" width="190" height="58" rx="12" fill="#22313d"/>
 <circle cx="372" cy="249" r="7" fill="#70e8dc"/>
 <text x="391" y="255" fill="#e8edf4" font-family="monospace" font-size="15">String + List</text>
 <rect x="350" y="292" width="190" height="58" rx="12" fill="#22313d"/>
 <circle cx="372" cy="321" r="7" fill="#b99aff"/>
 <text x="391" y="327" fill="#e8edf4" font-family="monospace" font-size="15">Expiry + Counter</text>
 <rect x="350" y="364" width="190" height="58" rx="12" fill="#22313d"/>
 <circle cx="372" cy="393" r="7" fill="#70e8dc"/>
 <text x="391" y="399" fill="#e8edf4" font-family="monospace" font-size="15">Snapshot + Replica</text>
 <rect x="622" y="214" width="126" height="198" rx="18" fill="#111821" stroke="#596676"/>
 <text x="648" y="248" fill="#a8b5c5" font-family="monospace" font-size="12">REPLICA</text>
 <path d="M650 278h70M650 302h54M650 326h70M650 350h47" stroke="#72e5da" stroke-width="6" stroke-linecap="round" opacity=".82"/>
 <text x="648" y="385" fill="#8997a8" font-family="monospace" font-size="11">SYNCED</text>
</g>
<g fill="none" stroke="url(#glow)" stroke-width="3" stroke-linecap="round"><path d="M265 280h39m-9-9 9 9-9 9"/><path d="M573 308h39m-9-9 9 9-9 9"/></g>
<text x="58" y="510" fill="#b5bdcb" font-family="monospace" font-size="13">PERSISTENT SNAPSHOTS · RESTART RECOVERY · WRITE OFFSETS</text>
</svg>
